# Builds the live site with build.py and publishes it.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
#
# The finished site is pushed to the gh-pages branch, and GitHub Pages serves
# that branch (Settings → Pages → Source: "Deploy from a branch", gh-pages, / (root)).
# Pull request previews live in gh-pages/pr-preview/ (see preview.yml); this
# workflow leaves that folder alone.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write access is needed to push to the gh-pages branch.
permissions:
  contents: write

# Shared with preview.yml so only one workflow writes to gh-pages at a time.
# Runs wait their turn instead of being cancelled halfway through a push.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No --base flag: links are built for the live address in site.json ("url").
      - run: python build.py
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          # Keep open pull request previews when replacing the live site.
          clean-exclude: pr-preview/
          force: false
