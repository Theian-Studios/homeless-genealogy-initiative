# Builds the site with build.py and publishes it to GitHub Pages.
# Runs on every push to main, or by hand from the Actions tab ("Run workflow").
# The repository's Settings → Pages → Source must be set to "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Just enough access to read the code and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, cancel the older run so only the latest publishes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No --base flag: links are built for the live address in site.json ("url").
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
