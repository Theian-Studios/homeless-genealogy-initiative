# Preview a proposed change before it goes live.
#
# When someone opens a pull request (for example by choosing "Create a new branch
# for this commit and start a pull request" when saving an edit on GitHub), this
# builds the site with the change and publishes it at
#   https://theian-studios.github.io/step/pr-preview/pr-<number>/
# then posts that link as a comment on the pull request. The preview updates on
# every new commit and is deleted when the pull request is merged or closed.
#
# Previews are hidden from search engines and carry a "not the live site" banner,
# but anyone who has the link can open them.
name: Preview pull request

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write        # push the preview to the gh-pages branch
  pull-requests: write   # post the preview link as a comment

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
      - if: github.event.action != 'closed'
        run: pip install -r requirements.txt
      - if: github.event.action != 'closed'
        run: python build.py --preview ${{ github.event.number }}
      # Publishes _site to gh-pages/pr-preview/pr-<number>/ and comments the link,
      # or removes that folder when the pull request is closed.
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
